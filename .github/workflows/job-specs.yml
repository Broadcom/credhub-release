name: CredHub Release Job Specs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.4']

    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Run tests
        run: |
          cd spec
          bundle 
          bundle exec rspec .
      - name: Run initialization specs as root
        run: |
          cd spec
          sudo -E env "PATH=$PATH" bundle exec rspec credhub/init_key_stores_spec.rb